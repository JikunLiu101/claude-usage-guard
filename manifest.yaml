apiVersion: v1
kind: Plugin
metadata:
  author: JikunLiu101
  name: claude-usage-guard
  repository: https://github.com/JikunLiu101/claude-usage-guard
  version: 0.2.0
  description:
    en_US: 'Usage meter and gate for the Claude Code Runner: locks the bot when the account 5-hour / 7-day usage or the bot''s own token window exceeds your limits. Platform independent.'
    zh_Hans: Claude Code Runner 的用量记录与闸门：账号 5 小时 / 7 天占用，或机器人自身窗口内的 token 用量，任一超过你设的上限就锁定。与接入平台无关。
  label:
    en_US: Claude Usage Guard
    zh_Hans: Claude 用量闸门
  icon: assets/icon.svg
spec:
  config:
  - name: data-dir
    label:
      en_US: Data directory
      zh_Hans: 数据目录
    description:
      en_US: Absolute local path, e.g. D:\langbot-data\usage-guard. Holds usage records, a copy of these settings and the wrapper (bin/claude_meter.py). After the plugin starts, the plugin log and COMMAND.txt in this directory show what to put into the Runner's command.
      zh_Hans: 本机绝对路径，例如 D:\langbot-data\usage-guard。用量记录、配置副本和包装脚本（bin/claude_meter.py）都放在这里。插件启动后，日志和这个目录里的 COMMAND.txt 会写明 Runner 的 command 应该填什么。
    type: string
    required: true
    default: ''
  - name: log-level
    label:
      en_US: Log level
      zh_Hans: 日志级别
    description:
      en_US: Plugin logs are shown on the plugin detail page in LangBot. INFO records config changes, locks and unlocks; DEBUG also logs the usage of every call.
      zh_Hans: 插件日志在 LangBot 的插件详情页里查看。INFO 记录配置变化、锁定和解锁；DEBUG 还会记录每次调用的用量。
    type: select
    required: false
    default: INFO
    options:
    - name: DEBUG
      label:
        en_US: DEBUG
        zh_Hans: DEBUG
    - name: INFO
      label:
        en_US: INFO
        zh_Hans: INFO
    - name: WARNING
      label:
        en_US: WARNING
        zh_Hans: WARNING
    - name: ERROR
      label:
        en_US: ERROR
        zh_Hans: ERROR
  - name: enabled
    label:
      en_US: Enable the gate
      zh_Hans: 启用闸门
    description:
      en_US: Off = only record usage, never lock.
      zh_Hans: 关闭时只记录用量，不锁定。
    type: boolean
    required: false
    default: true
  - name: five-hour-limit-percent
    label:
      en_US: Account 5-hour limit (%)
      zh_Hans: 账号 5 小时额度上限（%）
    description:
      en_US: Your Claude subscription has a rolling 5-hour allowance (the same one you see in Claude Code; your own usage counts too). When usage reaches this percentage the bot is locked until the window resets. 0 = no limit.
      zh_Hans: 你的 Claude 订阅账号有一个 5 小时滚动额度（和你在 Claude Code 里看到的是同一个，你自己用的也算在内）。占用达到这个百分比就锁定机器人，账号窗口重置后自动恢复。0 表示不限。
    type: integer
    required: false
    default: 80
  - name: seven-day-limit-percent
    label:
      en_US: Account 7-day limit (%)
      zh_Hans: 账号 7 天额度上限（%）
    description:
      en_US: Same for the account's 7-day allowance. 0 = no limit.
      zh_Hans: 同上，针对账号的 7 天额度。0 表示不限。
    type: integer
    required: false
    default: 90
  - name: bot-window-hours
    label:
      en_US: Bot window length (hours)
      zh_Hans: 机器人窗口长度（小时）
    description:
      en_US: 'The bot''s own usage window, timed like Claude''s 5-hour window: it starts with the first call after the previous window ended and resets after this many hours.'
      zh_Hans: 机器人自己的用量窗口，和 Claude 的 5 小时窗口一样计时：上一个窗口结束后的第一次调用开始，满这么多小时清零。
    type: integer
    required: false
    default: 5
  - name: bot-window-tokens
    label:
      en_US: Bot window token limit
      zh_Hans: 机器人窗口 token 上限
    description:
      en_US: Total tokens all calls through the wrapper (all pipelines together) may use in one window. Tokens are the unit models are metered in; a normal chat reply uses a few thousand. 0 = no limit.
      zh_Hans: 一个窗口内，所有经过本包装脚本的调用（所有流水线合计）最多用多少 token。token 是模型计量用量的单位，一次普通群聊回复大约几千个。0 表示不限。
    type: integer
    required: false
    default: 1000000
  - name: count-cache-read
    label:
      en_US: Count cache-read tokens
      zh_Hans: 缓存读取也计入
    description:
      en_US: 'Repeated parts of each call (such as the persona) are read from cache: cheap (about 1/10 of normal input) but usually the largest number. Off = count only input, output and cache writes.'
      zh_Hans: 每次调用里重复的部分（例如人设）会从缓存读取，很便宜（约为普通输入的 1/10），但数量通常最大。关闭时只计输入、输出和缓存写入。
    type: boolean
    required: false
    default: true
  - name: lock-output
    label:
      en_US: Reply when locked
      zh_Hans: 锁定时的回复
    description:
      en_US: 'When locked, Claude is not called; this text is handed to LangBot as the model''s reply. Placeholders: {reason} (why), {resets_in} (time until unlock). A pipeline can override it with CUG_LOCK_OUTPUT in the Runner''s env-json.'
      zh_Hans: 锁定时不调用 Claude，而是把这段文字当作模型的回复交给 LangBot。可用占位符：{reason}（锁定原因）、{resets_in}（多久后恢复）。单条流水线可以在 Runner 的环境变量（env-json）里用 CUG_LOCK_OUTPUT 覆盖。
    type: string
    required: false
    default: （额度暂时用完了，{resets_in}后恢复）
  - name: error-output
    label:
      en_US: Reply when Claude errors
      zh_Hans: Claude 出错时的回复
    description:
      en_US: Empty = pass the failure to LangBot unchanged (LangBot sends its own error notice). Otherwise this text is sent as the reply; {kind} becomes limit / refused / other. A pipeline can override it with CUG_ERROR_OUTPUT.
      zh_Hans: 留空 = 出错时原样交给 LangBot（LangBot 会发它自己的报错提示）。填了就把这段文字当作回复，{kind} 会替换成 limit（额度）/ refused（安全拒答）/ other（其他）。单条流水线可以用 CUG_ERROR_OUTPUT 覆盖。
    type: string
    required: false
    default: ''
  components:
    EventListener:
      fromDirs:
      - path: components/event_listener/
execution:
  python:
    path: main.py
    attr: ClaudeUsageGuard
